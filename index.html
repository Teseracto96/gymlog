<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>GymLog</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymLog">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"></main>

  <div id="mini-bar" role="button" aria-label="Volver al entreno en curso"></div>

  <nav class="tabbar">
    <button data-tab="history"><span class="ic">🗓</span>Historial</button>
    <button data-tab="workout"><span class="ic">＋</span>Entrenar</button>
    <button data-tab="exercises"><span class="ic">🏋️</span>Ejercicios</button>
    <button data-tab="progress"><span class="ic">📈</span>Progreso</button>
    <button data-tab="more"><span class="ic">⚙︎</span>Más</button>
  </nav>

  <div id="layers"></div>

  <!-- Datos -->
  <script src="data/exercises.js"></script>
  <script src="data/seed-history.js"></script>
  <!-- Núcleo -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/db.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/ui.js"></script>
  <!-- Módulos -->
  <script src="js/modules/exercises.js"></script>
  <script src="js/modules/templates.js"></script>
  <script src="js/modules/workout.js"></script>
  <script src="js/modules/history.js"></script>
  <script src="js/modules/progress.js"></script>
  <script src="js/modules/tools.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
